    <!-- Suppress harmless iframe / cloud preview websocket error messages -->
    <script>
      (function() {
        const suppressKeywords = ['WebSocket closed without opened', 'failed to connect to websocket', '[vite] failed to connect'];
        const origError = console.error;
        console.error = function(...args) {
          const text = args.map(a => (typeof a === 'string' ? a : (a && (a.message || a.stack)) || '')).join(' ');
          if (suppressKeywords.some(keyword => text.includes(keyword))) {
            return;
          }
          origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          const text = args.map(a => (typeof a === 'string' ? a : (a && (a.message || a.stack)) || '')).join(' ');
          if (suppressKeywords.some(keyword => text.includes(keyword))) {
            return;
          }
          origWarn.apply(console, args);
        };
      })();
    </script>
